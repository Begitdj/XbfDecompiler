name: Build XbfDecompiler

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore XbfDecompiler.sln

      - name: Build solution
        run: msbuild XbfDecompiler.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: XbfDecompiler-Binary
          path: XbfDecompiler/bin/Release/
